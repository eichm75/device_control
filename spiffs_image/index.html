<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>ESP32-S3 Control</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding-top: 50px; }
        .btn { padding: 20px 40px; font-size: 20px; cursor: pointer; margin: 10px; border: none; border-radius: 8px; color: white; }
        .on { background-color: #4CAF50; }
        .off { background-color: #f44336; }
    </style>
</head>
<body>
    <h1>Управление ESP32-S3</h1>
    <button class="btn on" onclick="send('EM1:LED_ON:75')">ВКЛЮЧИТЬ</button>
    <button class="btn off" onclick="send('EM1:LED_OFF:567')">ВЫКЛЮЧИТЬ</button>
    <button class="btn on" onclick="send('EM2:SET_BRIGHTNESS:75')">ЯРКОСТЬ</button>
    <button class="btn off" onclick="send('EM1:GET_STATUS:')">СТАТУС</button>
    <button class="btn on" onclick="send('EM2:REBOOT:')">ПЕРЕЗАГРУЗКА</button>
    <button class="btn off" onclick="send('EM3:GET_SENSOR_DATA:5')">ДАННЫЕ ДАТЧИКА</button>
</body>
    <script>
        // Создаем путь ws://192.168.4.1/ws
        var gateway = `ws://${window.location.hostname}/ws`;
        var websocket;

        function initWebSocket() {
            websocket = new WebSocket(gateway);
            websocket.onopen = () => console.log('Соединение установлено');
            websocket.onclose = () => setTimeout(initWebSocket, 2000); // Реконнект при обрыве
        }

        function send(message) {
            websocket.send(message); // Отправляем простую строку
        }

        window.onload = initWebSocket;
    </script>
</body>
</html>
